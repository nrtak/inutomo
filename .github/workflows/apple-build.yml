name: Apple builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  GODOT_VERSION: 4.5.1

jobs:
  validate-and-build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          target="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          cp -R "$RUNNER_TEMP/templates/templates/." "$target/"
      - name: Import and check scripts
        run: |
          set -euo pipefail
          Godot --headless --path . --import
          Godot --headless --path . --editor --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Gameplay and save regression tests
        run: |
          Godot --headless --path . --script tests/smoke.gd
          Godot --headless --path . --script tests/start_menu.gd
          Godot --headless --path . --script tests/growth.gd
          Godot --headless --path . --script tests/gait.gd
          Godot --headless --path . --script tests/walk_areas.gd
          Godot --headless --path . --script tests/player_features.gd
          Godot --headless --path . --script tests/locations.gd
          Godot --headless --path . --script tests/mobile_regression.gd
      - name: Configure Apple project identity
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('export_presets.cfg')
          text = path.read_text()
          team = os.environ.get('APPLE_TEAM_ID') or 'R3233N87DC'
          bundle = os.environ.get('IOS_BUNDLE_ID') or 'com.inujima.app'
          if not re.fullmatch(r'[A-Z0-9]{10}', team):
              raise ValueError('APPLE_TEAM_ID must have 10 uppercase letters or digits')
          if not re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+', bundle):
              raise ValueError('IOS_BUNDLE_ID must be a valid reverse-DNS identifier')
          text = text.replace('R3233N87DC', team).replace('com.inujima.app', bundle)
          text = text.replace('application/version="1"', 'application/version="' + os.environ['GITHUB_RUN_NUMBER'] + '"')
          path.write_text(text)
          PY
      - name: Build macOS app
        run: |
          mkdir -p build/macos
          Godot --headless --path . --export-release macOS build/macos/PuppyIsland.zip
      - name: Export iOS Xcode project
        run: |
          mkdir -p build/ios
          Godot --headless --path . --export-release iOS build/ios/PuppyIsland.zip
      - name: Compile unsigned iPhone app
        run: |
          xcodebuild -project build/ios/PuppyIsland.xcodeproj \
            -scheme PuppyIsland -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-derived/Build/Products/Release-iphoneos/PuppyIsland.app \
            build/ios/PuppyIsland-unsigned.app.zip
      - uses: actions/upload-artifact@v6
        with:
          name: PuppyIsland-macOS
          path: build/macos/PuppyIsland.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: PuppyIsland-iOS-Xcode-and-unsigned-app
          path: build/ios/
          if-no-files-found: error
      - name: Build summary
        run: |
          echo 'macOS app and unsigned iPhone app compiled. iOS artifact includes the Xcode project.' >> "$GITHUB_STEP_SUMMARY"
          echo 'To publish to TestFlight, run this workflow on main with Upload a signed build to TestFlight selected. Signing credentials must be configured in Actions secrets.' >> "$GITHUB_STEP_SUMMARY"

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight && github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.inujima.app' }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'R3233N87DC' }}
    steps:
      - uses: actions/checkout@v6
      - name: Check signing configuration
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE_BASE64 }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in P12 PASSWORD PROFILE ISSUER KEY_ID KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing signing credential: $name"; exit 1; fi
          done
      - uses: actions/download-artifact@v6
        with:
          name: PuppyIsland-iOS-Xcode-and-unsigned-app
          path: build/ios
      - uses: Apple-Actions/import-codesign-certs@v4
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install app distribution profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: python3 scripts/install_profile.py
      - name: Archive and export signed iPhone app
        run: |
          set -euo pipefail
          xcodebuild archive -project build/ios/PuppyIsland.xcodeproj -scheme PuppyIsland \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/PuppyIsland.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          xcodebuild -exportArchive -archivePath build/PuppyIsland.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export
      - uses: actions/upload-artifact@v6
        with:
          name: PuppyIsland-ipa
          path: build/export/PuppyIsland.ipa
          if-no-files-found: error
      - uses: Apple-Actions/upload-testflight-build@v5
        with:
          backend: altool
          app-path: build/export/PuppyIsland.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Remove provisioning materials
        if: always()
        run: python3 scripts/install_profile.py --clean
